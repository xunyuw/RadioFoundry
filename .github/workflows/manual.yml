#
# The user manual (docs/dev/release.md): check the doc links, build the PDF from docs/user with pandoc and typst,
# and on a v* tag attach it to the GitHub release (created when missing). Independent of the firmware build. Pull
# requests get the same check from pr-tests.yml, which runs main's copy of the workflow.
name: User manual

on:
  push:
    tags: ["v*"]
    branches: [main]
    paths:
      - "docs/**"
      - "README.md"
      - "tools/build_manual.sh"
      - "tools/manual/**"
      - "tools/check_doc_links.py"
      - ".github/workflows/manual.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  PANDOC_VERSION: "3.6.4"
  TYPST_VERSION: "0.13.1"

jobs:
  manual:
    runs-on: ubuntu-24.04   # a write token: GitHub's runners only (docs/dev/ci-runners.md)
    permissions:
      contents: write   # gh release create / upload on tags
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          submodules: false   # the manual needs none of third_party

      - name: Check doc links
        run: python3 tools/check_doc_links.py

      - name: Install pandoc and typst
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/tools"
          cd "$RUNNER_TEMP/tools"
          curl -fsSL -o pandoc.tar.gz \
            "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-linux-amd64.tar.gz"
          tar -xzf pandoc.tar.gz
          curl -fsSL -o typst.tar.xz \
            "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz"
          tar -xJf typst.tar.xz
          echo "PANDOC=$RUNNER_TEMP/tools/pandoc-${PANDOC_VERSION}/bin/pandoc" >> "$GITHUB_ENV"
          echo "TYPST=$RUNNER_TEMP/tools/typst-x86_64-unknown-linux-musl/typst" >> "$GITHUB_ENV"
          # A translated manual needs a face for its script: typst carries Latin ones only. One CJK face covers every
          # language the site translates into, and build_manual.sh hands the directory to typst with --font-path
          mkdir -p "$RUNNER_TEMP/fonts"
          curl -fsSL -o "$RUNNER_TEMP/fonts/NotoSansSC.ttf" \
            "https://github.com/notofonts/noto-cjk/raw/main/Sans/SubsetOTF/SC/NotoSansSC-Regular.otf"
          echo "RFOUNDRY_MANUAL_FONTS=$RUNNER_TEMP/fonts" >> "$GITHUB_ENV"

      - name: Build the PDF
        run: |
          set -eu
          "$PANDOC" --version | head -1
          "$TYPST" --version
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            VERSION="${GITHUB_REF_NAME}"
            REF="${GITHUB_REF_NAME}"
          else
            VERSION="$(git rev-parse --short=8 HEAD)"
            REF="${GITHUB_SHA}"
          fi
          # Every language the site translates the manual into gets its own PDF, so a reader who uses the radio in that
          # language has a book in it: the English one, then each docs/i18n/<code>/user/ tree
          OUT="build/manual/RadioFoundry-manual-${VERSION}.pdf"
          RFOUNDRY_REPO_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${REF}" \
            tools/build_manual.sh --version "$VERSION" --out "$OUT"
          MANUALS="$OUT"
          for L in $(ls docs/i18n 2>/dev/null); do
            [ -d "docs/i18n/$L/user" ] || continue
            OUT="build/manual/RadioFoundry-manual-${VERSION}-${L}.pdf"
            RFOUNDRY_REPO_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${REF}" \
              tools/build_manual.sh --version "$VERSION" --lang "$L" --out "$OUT"
            MANUALS="$MANUALS $OUT"
          done
          echo "MANUAL_PDF=$MANUALS" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with:
          name: user-manual
          path: ${{ env.MANUAL_PDF }}
          if-no-files-found: error

      - name: Attach to the release
        if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          TAG="${GITHUB_REF_NAME}"
          # This workflow and the firmware one both run on a tag and either may reach the release first. Everything a
          # release needs to say about itself is decided here and in release.yml by the same rule, so a release the
          # manual created reads the same as one the firmware did: a pre-release for bN and for a fork's name, and a
          # title and notes that say an unofficial build is one.
          PRE=""
          if python3 tools/release_version.py prerelease "$TAG"; then PRE=--prerelease; fi
          TITLE="RadioFoundry $TAG"
          NOTES="Firmware images (without the AMBE codec), rfoundry and the user manual. Flash with: rfoundry flash --release ${TAG} (docs/user/02-installing.md)."
          if ! python3 tools/release_version.py own "$TAG"; then
            TITLE="$TAG (unofficial build)"
            NOTES=$(printf '%s\n\n%s' "**This is not an official RadioFoundry release.** It was built from a modified tree, and the RadioFoundry project does not support it: ask whoever published it." "$NOTES")
          fi
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --verify-tag $PRE --generate-notes --title "$TITLE" --notes "$NOTES"
          fi
          gh release upload "$TAG" "$MANUAL_PDF" --clobber
